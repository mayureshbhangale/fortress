[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortress"
version = "1.0.0"
description = "Your project — built on the Fortress quality template"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "radon>=6.0.1",
    "pylint>=3.0.0",
    "bandit>=1.7.8",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pre-commit>=3.7.0",
    "python-semantic-release>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ── Black ────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py312"]

# ── isort ────────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "SIM"]
ignore = ["E501", "S101"]  # S101: allow assert in tests

# ── MyPy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--tb=short"]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ── Radon ────────────────────────────────────────────────────────────────────
[tool.radon]
cc_min = "C"

# ── Semantic Release ─────────────────────────────────────────────────────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install build && python -m build"
